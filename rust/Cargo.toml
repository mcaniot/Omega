[package]
name = "omega-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
libc = "0.2"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
